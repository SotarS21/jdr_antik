name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write version into system.json
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("system.json", "utf8"));
            manifest.version = "${{ steps.version.outputs.version }}";
            fs.writeFileSync("system.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build package archive
        run: |
          zip -r system.zip \
            system.json template.json antique.mjs \
            css lang module templates fonts \
            packs/*.db packs/token

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            system.zip
            system.json
