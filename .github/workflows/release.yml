name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write version + manifest/download into system.json
        # Only ever touches the CI runner's checkout, never committed back to the repo —
        # system.json in source control keeps manifest/download empty on purpose, so
        # version-check.mjs's dev-deploy guard (game.system.manifest is falsy) stays correct
        # for local `deploy` copies. Only the released system.json/zip gets these filled in.
        run: |
          node -e '
            const fs = require("fs");
            const repo = "${{ github.repository }}";
            const tag = "${{ github.ref_name }}";
            const manifest = JSON.parse(fs.readFileSync("system.json", "utf8"));
            manifest.version = "${{ steps.version.outputs.version }}";
            manifest.manifest = `https://github.com/${repo}/releases/latest/download/system.json`;
            manifest.download = `https://github.com/${repo}/releases/download/${tag}/system.zip`;
            fs.writeFileSync("system.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build package archive
        run: |
          zip -r system.zip \
            system.json template.json antique.mjs \
            css lang module templates fonts \
            packs/*.db packs/token

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            system.zip
            system.json
